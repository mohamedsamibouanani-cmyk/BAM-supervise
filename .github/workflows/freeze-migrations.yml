name: Freeze Django migrations

on:
  push:
    branches: [agent/initial-bam-supervise]
    paths:
      - '.github/workflows/freeze-migrations.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate initial migrations
        run: DB_ENGINE=sqlite python manage.py makemigrations supervision --noinput
      - name: Commit frozen migrations
        run: |
          rm -f .github/workflows/freeze-migrations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze initial Django migrations'
          git push
