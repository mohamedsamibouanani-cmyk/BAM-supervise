name: Bootstrap source tree

on:
  push:
    branches: [agent/initial-bam-supervise]
    paths:
      - 'bundle/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project source
        run: |
          cat bundle/part-* | base64 -d > /tmp/bam_source.tar.gz
          tar -xzf /tmp/bam_source.tar.gz -C .
          rm -rf bundle
          rm -f .github/workflows/bootstrap.yml
      - name: Commit extracted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Expand BAM Supervise source tree'
            git push
          fi
