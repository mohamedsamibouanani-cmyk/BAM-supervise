name: Validation finale - 6 cycles

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cycle1_unit_schema:
    name: Cycle 1 - Donnees unite et schema
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: cycle1-test-secret-key-2026
      BAM_DATA_ENCRYPTION_KEY: cycle1-data-key-2026
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No pending model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Comparison import and data protection tests
        run: python manage.py test supervision.tests.test_utils supervision.tests.test_comparison supervision.tests.test_attribute_constraints supervision.tests.test_data_protection supervision.tests.test_import_security

  cycle2_security_accessibility:
    name: Cycle 2 - Securite accessibilite navigateur
    runs-on: ubuntu-latest
    needs: cycle1_unit_schema
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: cycle2-test-secret-key-2026
      BAM_DATA_ENCRYPTION_KEY: cycle2-data-key-2026
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Negative security and governance tests
        run: python manage.py test supervision.tests.test_security supervision.tests.test_governance supervision.tests.test_accessibility_quality
      - name: Production deploy checks
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: production-like-secret-key-for-ci-2026-very-long-and-private
          DJANGO_ALLOWED_HOSTS: bam.example.internal
          DJANGO_SECURE_COOKIES: '1'
          DJANGO_SECURE_SSL_REDIRECT: '1'
          DJANGO_HSTS_SECONDS: '31536000'
          DJANGO_HSTS_PRELOAD: '1'
          BAM_DATA_ENCRYPTION_KEY: production-like-data-encryption-key-for-ci-2026
        run: python manage.py check --deploy --fail-level WARNING

  cycle3_supervisor_six_runs:
    name: Cycle 3 - Recette superviseur six parcours
    runs-on: ubuntu-latest
    needs: cycle2_security_accessibility
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: cycle3-test-secret-key-2026
      BAM_DATA_ENCRYPTION_KEY: cycle3-data-key-2026
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Six complete end-user cycles
        run: python manage.py test supervision.tests.test_supervisor_six_cycles
      - name: Anomaly register and validation UX
        run: python manage.py test supervision.tests.test_anomaly_list supervision.tests.test_anomaly_workflow supervision.tests.test_validation_form_ui

  cycle4_email_routing:
    name: Cycle 4 - Routage emails et relances
    runs-on: ubuntu-latest
    needs: cycle3_supervisor_six_runs
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: cycle4-test-secret-key-2026
      BAM_DATA_ENCRYPTION_KEY: cycle4-data-key-2026
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Email delivery routing and retry tests
        run: python manage.py test supervision.tests.test_email supervision.tests.test_email_five_cycles supervision.tests.test_multi_system_notifications supervision.tests.test_multi_cause_corrections supervision.tests.test_notification_retry
      - name: Full Django regression suite
        run: python manage.py test

  cycle5_mysql:
    name: Cycle 5 - Integration MySQL 8.4
    runs-on: ubuntu-latest
    needs: cycle4_email_routing
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bam_supervise
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_ENGINE: mysql
      MYSQL_DATABASE: bam_supervise
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      DJANGO_SECRET_KEY: cycle5-mysql-secret-key-2026
      BAM_DATA_ENCRYPTION_KEY: cycle5-mysql-data-key-2026
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Migrate seed and protect MySQL
        run: |
          python manage.py migrate --noinput
          python manage.py seed_bam
          python manage.py protect_sensitive_data
          python manage.py check
      - name: Six supervisor cycles on MySQL
        run: python manage.py test supervision.tests.test_supervisor_six_cycles
      - name: Critical routing tests on MySQL
        run: python manage.py test supervision.tests.test_multi_system_notifications supervision.tests.test_notification_retry
      - name: Full tests on MySQL
        run: python manage.py test

  cycle6_docker_e2e:
    name: Cycle 6 - Docker navigateur HTTP securite
    runs-on: ubuntu-latest
    needs: cycle5_mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Docker environment
        run: |
          cp .env.example .env
          sed -i 's/EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend/EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend/' .env
          sed -i 's/EMAIL_ALLOW_SIMULATED_DELIVERY=0/EMAIL_ALLOW_SIMULATED_DELIVERY=1/' .env
          sed -i 's/DJANGO_SUPERVISEUR_PASSWORD=/DJANGO_SUPERVISEUR_PASSWORD=Strong-Docker-Test-Password-2026!/' .env
      - name: Validate Compose
        run: docker compose config
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for HTTP application
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/login/ | grep -q 'BAM Supervise'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs web
          exit 1
      - name: Verify local assets and CSP compatible validation code
        run: |
          curl -fsS http://127.0.0.1:8000/static/supervision/app.css | grep -q -- '--mit-red'
          curl -fsS http://127.0.0.1:8000/static/supervision/bam-theme.css | grep -q -- '--bam-blue:#244b9b'
          curl -fsS http://127.0.0.1:8000/static/supervision/bam-theme.css | grep -q -- '--bam-yellow:#ffdc00'
          curl -fsS http://127.0.0.1:8000/static/supervision/accessibility.css | grep -q 'skip-link'
          curl -fsS http://127.0.0.1:8000/static/supervision/validation-form.js | grep -q 'initValidationPage'
          curl -fsS http://127.0.0.1:8000/static/supervision/notification-list.css | grep -q 'notification-error'
          curl -fsS http://127.0.0.1:8000/static/vendor/bootstrap/bootstrap.min.css | grep -qi 'bootstrap'
          curl -fsS http://127.0.0.1:8000/static/vendor/chart/chart.umd.min.js | grep -q 'Chart'
      - name: Verify browser security headers
        run: |
          headers="$(curl -fsSI http://127.0.0.1:8000/login/ | tr -d '\r')"
          echo "$headers" | grep -qi '^Content-Security-Policy:'
          echo "$headers" | grep -qi "script-src 'self'"
          if echo "$headers" | grep -qi "script-src 'self' 'unsafe-inline'"; then
            echo 'Inline scripts must remain blocked by CSP.'
            exit 1
          fi
          echo "$headers" | grep -qi "object-src 'none'"
          echo "$headers" | grep -qi '^X-Frame-Options: DENY'
          echo "$headers" | grep -qi '^X-Content-Type-Options: nosniff'
          echo "$headers" | grep -qi '^Referrer-Policy: same-origin'
          echo "$headers" | grep -qi '^Cross-Origin-Resource-Policy: same-origin'
      - name: Seed six browser dossiers and collaborators
        run: |
          docker compose exec -T web python manage.py shell <<'PY'
          from supervision.models import Anomalie, CampagneSupervision, ContactGroupe, GroupeResponsable, Systeme, Superviseur
          sup = Superviseur.objects.get(username='superviseur')
          targets = ['SMI', 'SICOM', 'SIBO', 'SMI', 'SICOM', 'SIBO']
          for code in ('SMI', 'SICOM', 'SIBO'):
              system = Systeme.objects.get(code_systeme=code)
              groupe = GroupeResponsable.objects.filter(systeme=system, actif=True).first()
              ContactGroupe.objects.get_or_create(groupe=groupe, email=f'{code.lower()}@example.com', defaults={'nom_complet': f'Browser {code}'})
          for i, target in enumerate(targets, start=1):
              campaign = CampagneSupervision.objects.create(superviseur=sup)
              observed = Systeme.objects.get(code_systeme='SIBO' if target != 'SIBO' else 'SICOM')
              Anomalie.objects.create(campagne=campaign, niveau='ENVOI', type_ecart='ABSENT', code_envoi=f'BROWSER-{i:02d}', systeme_ecart=observed, statut='ANALYSEE', empreinte_anomalie=f'browser-{i:02d}'.ljust(64, '0'))
          PY
      - name: Run six real Chromium supervisor cycles
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          targets = ['SMI', 'SICOM', 'SIBO', 'SMI', 'SICOM', 'SIBO']
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('http://127.0.0.1:8000/login/')
              page.locator('input[name="username"]').fill('superviseur')
              page.locator('input[name="password"]').fill('Strong-Docker-Test-Password-2026!')
              page.locator('button[type="submit"]').click()
              page.wait_for_url('http://127.0.0.1:8000/')
              for i, target in enumerate(targets, start=1):
                  page.goto(f'http://127.0.0.1:8000/anomalies/{i}/valider/')
                  page.get_by_role('heading', name='Valider le diagnostic').wait_for()
                  page.locator('input[name="decision"][value="MODIFIE"]').check()
                  page.locator('#adjustmentPanel').wait_for(state='visible')
                  page.locator('#id_motif_final').select_option(label='Ville obligatoire manquante')
                  page.locator('#id_systeme_a_corriger_final').select_option(label=target)
                  page.locator('#submitDecision').click()
                  page.wait_for_url(f'http://127.0.0.1:8000/anomalies/{i}/')
                  page.get_by_text('Notifiée', exact=True).first.wait_for()
              browser.close()
          PY
      - name: Verify six browser notifications persisted
        run: |
          docker compose exec -T web python manage.py shell -c "from supervision.models import Notification; sent=Notification.objects.filter(statut='ENVOYEE'); assert sent.count()==6, sent.count(); assert set(sent.values_list('groupe__systeme__code_systeme',flat=True))=={'SMI','SICOM','SIBO'}"
      - name: Verify hardened runtime
        run: |
          docker compose exec -T web sh -c "grep '^Uid:' /proc/1/status | grep -Eq 'Uid:[[:space:]]+10001[[:space:]]+10001'"
          if docker compose exec -T web sh -c 'touch /app/runtime-must-be-read-only'; then
            echo 'Container root filesystem unexpectedly writable.'
            exit 1
          fi
      - name: Container status and Django checks
        run: |
          docker compose ps
          docker compose exec -T web python manage.py check
      - name: Stop containers
        if: always()
        run: docker compose down -v
