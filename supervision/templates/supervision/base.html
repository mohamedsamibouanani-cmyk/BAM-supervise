{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BAM Supervise{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'supervision/app.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bam-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">BAM Supervise</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav ms-auto align-items-center gap-2">
      <a class="nav-link" href="{% url 'campaign_create' %}">Nouvel import</a>
      <a class="nav-link" href="{% url 'anomaly_list' %}">Anomalies</a>
      <a class="nav-link" href="{% url 'group_list' %}">Collaborateurs</a>
      <a class="nav-link" href="/admin/">Administration</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Déconnexion</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
